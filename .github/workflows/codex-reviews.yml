name: Codex PR reviews

'on':
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  issues: read

env:
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  queue-freshness:
    name: Verify Codex reviews for the queued merge
    if: github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Match both successful PR reviews to the queue snapshot
        env:
          QUEUE_REF: ${{ github.ref }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [[ ! "$QUEUE_REF" =~ ^refs/heads/gh-readonly-queue/master/pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
            fail "Cannot identify a single pull request for this merge group."
          fi
          pr_number=${BASH_REMATCH[1]}
          repo="repos/$GITHUB_REPOSITORY"
          pr=$(gh api "$repo/pulls/$pr_number")
          head=$(jq -er '.head.sha' <<< "$pr")
          base=$(jq -er '.base.sha' <<< "$pr")
          merge_commit=$(jq -er '.merge_commit_sha' <<< "$pr")
          live_base=$(gh api "$repo/git/ref/heads/master" --jq '.object.sha')
          if [[ "$base" != "$QUEUE_BASE" || "$live_base" != "$QUEUE_BASE" ||
                "$QUEUE_HEAD" != "$GITHUB_SHA" ]] ||
             ! jq -e --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .base.ref == "master" and .head.repo.full_name == $repo' <<< "$pr" >/dev/null; then
            fail "The queued PR does not match the current master snapshot. Refresh the PR and rerun the reviews."
          fi

          queued_tree=$(gh api "$repo/git/commits/$QUEUE_HEAD" --jq '.tree.sha')
          pr_tree=$(gh api "$repo/git/commits/$merge_commit" --jq '.tree.sha')
          if [[ "$queued_tree" != "$pr_tree" ]]; then
            fail "The queued tree differs from this PR's merge tree. Requeue the PR separately."
          fi

          evidence="$pr_number $QUEUE_BASE $head"
          # GitHub checks the synthetic merge commit first when it has a check.
          merge_checks=$(gh api "$repo/commits/$merge_commit/check-runs?filter=latest&per_page=100" --paginate --slurp)
          head_checks=$(gh api "$repo/commits/$head/check-runs?filter=latest&per_page=100" --paginate --slurp)
          for check in "Codex Code Review / master" "Codex Security / master"; do
            record=$(jq -nce --arg check "$check" --argjson merge "$merge_checks" --argjson head "$head_checks" '
              def latest: [.[].check_runs[] | select(.name == $check and .app.id == 15368)] | max_by(.id);
              ($merge | latest) // ($head | latest)
            ') || fail "The required check $check is missing."
            if ! jq -e '.status == "completed" and .conclusion == "success"' <<< "$record" >/dev/null; then
              fail "The required check $check has not completed successfully."
            fi
            id=$(jq -er '.id' <<< "$record")
            job=$(gh api "$repo/actions/jobs/$id")
            run_id=$(jq -er '.run_id' <<< "$job")
            if ! jq -e --argjson id "$id" --arg check "$check" --arg repo "$repo" '
              .id == $id and .name == $check and .conclusion == "success" and
              (.check_run_url | endswith("/" + $repo + "/check-runs/" + ($id | tostring)))
            ' <<< "$job" >/dev/null; then
              fail "The Actions job for $check does not match its check run."
            fi
            workflow=$(gh api "$repo/actions/runs/$run_id")
            if ! jq -e --argjson pr "$pr_number" --arg head "$head" '
              . as $run | ".github/workflows/codex-reviews.yml" as $path |
              ($run.path == $path or $run.path == ($path + "@" + $run.head_branch) or
               $run.path == ($path + "@refs/heads/" + $run.head_branch) or
               $run.path == ($path + "@refs/pull/" + ($pr | tostring) + "/merge")) and
              $run.event == "pull_request" and $run.head_sha == $head and
              any($run.pull_requests[]; .number == $pr and .head.sha == $head and .base.ref == "master")
            ' <<< "$workflow" >/dev/null; then
              fail "The required check $check did not originate from this PR workflow."
            fi
            annotations=$(gh api "$repo/check-runs/$id/annotations?per_page=100")
            if ! jq -e --arg evidence "$evidence" '
              any(.[]; .annotation_level == "notice" and .title == "Codex verified PR snapshot" and .message == $evidence)
            ' <<< "$annotations" >/dev/null; then
              fail "The required check $check is stale. Refresh the PR and rerun both reviews for the current master."
            fi
          done
          echo "Both reviews match queued PR #$pr_number at $head on $QUEUE_BASE."

  code-review:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata / ' || '' }}Codex Code Review / master
    needs: queue-freshness
    if: >-
      always() && (
        (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)) ||
        (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/master')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Require matching review evidence for the queued merge
        if: github.event_name == 'merge_group'
        env:
          QUEUE_RESULT: ${{ needs.queue-freshness.result }}
        run: test "$QUEUE_RESULT" = success
      - &verify-snapshot
        name: Verify the current PR snapshot
        if: github.event_name == 'pull_request'
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '[.head.sha, .base.ref, .base.sha] | @tsv')
          expected=$(printf '%s\t%s\t%s' "$PR_HEAD_SHA" "$PR_BASE_REF" "$PR_BASE_SHA")
          live_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$current" != "$expected" || "$live_base" != "$PR_BASE_SHA" ]]; then
            echo "::error::The PR head or master has changed. Run checks on the current snapshot."
            exit 1
          fi

      - name: Require the Codex Connector's review for this commit
        if: github.event_name == 'pull_request'
        run: |
          deadline=$((SECONDS + 660))
          while (( SECONDS < deadline )); do
            reviews=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --paginate --slurp)
            review=$(jq -c --arg head "$PR_HEAD_SHA" '
              [.[][] | select(
                .user.type == "Bot" and
                .user.id == 199175422 and
                .performed_via_github_app.id == 1144995
              ) |
                (.body | split("\n")) as $lines |
                select($lines[0] == "<!-- codex-pull-request-review-summary -->") |
                (($lines[1] // "") |
                  select(startswith("<!-- codex-review-state:v1 ") and endswith(" -->")) |
                  (try (ltrimstr("<!-- codex-review-state:v1 ") | rtrimstr(" -->") | fromjson) catch null)
                ) as $state |
                select($state.code_review.commit_sha == $head) |
                {id, created_at, review: $state.code_review}]
              | sort_by(.created_at, .id) | last | .review
            ' <<< "$reviews")
            status=$(jq -r '.status // ""' <<< "$review")
            if [[ "$status" == completed ]]; then
              if jq -e '.has_unresolved_findings == false' <<< "$review" >/dev/null; then
                echo "Codex Code Review completed for $PR_HEAD_SHA with no unresolved findings."
                exit 0
              fi
              # GitHub requires review conversations to be resolved; the Connector can lag behind that state.
              threads=$(gh api graphql --paginate --slurp \
                -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $pr) {
                      reviewThreads(first: 100, after: $endCursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' \
                -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" -F pr="$PR_NUMBER")
              if jq -e '
                [.[].data.repository.pullRequest.reviewThreads.nodes[]] |
                length > 0 and all(.[]; .isResolved == true)
              ' <<< "$threads" >/dev/null; then
                echo "Codex Code Review completed for $PR_HEAD_SHA and its GitHub review conversations are resolved."
                exit 0
              fi
              echo "::error::Resolve the Codex Code Review findings and rerun this check."
              exit 1
            fi
            # A fresh connector attempt for the same head can replace a failed or canceled attempt.
            sleep 15
          done
          echo "::error::No completed Codex Code Review was received for $PR_HEAD_SHA. Request a fresh review and rerun this check."
          exit 1

      - *verify-snapshot
      - name: Record the reviewed PR snapshot
        if: github.event_name == 'pull_request'
        run: echo "::notice file=.github/workflows/codex-reviews.yml,line=1,title=Codex verified PR snapshot::$PR_NUMBER $PR_BASE_SHA $PR_HEAD_SHA"

  security-scan:
    name: Scan changes with Codex Security
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      scan-status: ${{ steps.security.outputs.scan-status }}
      skip-reason: ${{ steps.security.outputs.skip-reason }}
      policy-status: ${{ steps.security.outputs.policy-status }}
      scanned-sha: ${{ steps.security.outputs.scanned-sha }}
    steps:
      - *verify-snapshot
      - name: Verify the Security credential is available
        env:
          CODEX_SECURITY_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
        run: |
          if [[ -z "$CODEX_SECURITY_KEY" ]]; then
            echo "::error::CODEX_SECURITY_API_KEY is unavailable to this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Review PR changes
        id: security
        uses: openai/codex-security@a98b35d7eef9f85c298c86229445bb64ac427aaf # action-v0.9.1
        with:
          scope: diff
          model: gpt-5.6-sol
          effort: high
          max-cost: '5'
          fail-on-severity: high
          verbose: 'false'
          summary: 'false'
          annotations: 'false'
          upload-artifacts: 'false'
        env:
          GH_TOKEN: ''
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}

  security-review:
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata / ' || '' }}Codex Security / master
    needs: [queue-freshness, security-scan]
    if: >-
      always() && (
        (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)) ||
        (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/master')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Require matching review evidence for the queued merge
        if: github.event_name == 'merge_group'
        env:
          QUEUE_RESULT: ${{ needs.queue-freshness.result }}
        run: test "$QUEUE_RESULT" = success
      - *verify-snapshot
      - name: Require a completed Security scan for this commit
        if: github.event_name == 'pull_request'
        env:
          SCAN_RESULT: ${{ needs.security-scan.result }}
          SCAN_STATUS: ${{ needs.security-scan.outputs.scan-status }}
          SKIP_REASON: ${{ needs.security-scan.outputs.skip-reason }}
          SCAN_POLICY: ${{ needs.security-scan.outputs.policy-status }}
          SCANNED_SHA: ${{ needs.security-scan.outputs.scanned-sha }}
        run: |
          if [[ "$SCAN_RESULT" == success && "$SCAN_STATUS" == skipped && "$SKIP_REASON" == empty-diff ]]; then
            echo "Codex Security verified an empty diff for $PR_HEAD_SHA."
            exit 0
          fi
          if [[ "$SCAN_RESULT" != success || "$SCAN_STATUS" != completed ||
                "$SCAN_POLICY" != passed || "$SCANNED_SHA" != "$PR_HEAD_SHA" ]]; then
            echo "::error::Codex Security must complete and pass for the current PR commit."
            exit 1
          fi
          echo "Codex Security completed and passed for $PR_HEAD_SHA."
      - name: Record the reviewed PR snapshot
        if: github.event_name == 'pull_request'
        run: echo "::notice file=.github/workflows/codex-reviews.yml,line=1,title=Codex verified PR snapshot::$PR_NUMBER $PR_BASE_SHA $PR_HEAD_SHA"
