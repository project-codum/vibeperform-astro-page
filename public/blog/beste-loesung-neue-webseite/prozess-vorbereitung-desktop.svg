<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">12 Vorbereitungsaufgaben für eine neue Webseite</title>
  <desc id="desc">Eine bedarfsgerechte Checkliste in vier Phasen: Ziel und Rahmen, Recherche und Inhalte, Texte und Marke sowie Start vorbereiten. Danach wird die Website gebaut.</desc>
  <defs><style>
    text{font-family:Inter,Arial,sans-serif;fill:#1C1726}.eyebrow{font-size:17px;font-weight:700;letter-spacing:2px;fill:#8038EE}.headline{font-size:42px;font-weight:750}.sub{font-size:20px;fill:#655F69}.phase{font-size:23px;font-weight:750}.item{font-size:17px;font-weight:550}.num{font-size:15px;font-weight:800;fill:#fff}.foot{font-size:16px;fill:#655F69}.build{font-size:22px;font-weight:750;fill:#fff}
  </style></defs>
  <rect width="1600" height="920" rx="34" fill="#EDE8E3"/>
  <text x="76" y="77" class="eyebrow">VORBEREITUNG EINER FIRMENWEBSEITE</text>
  <text x="76" y="137" class="headline">12 Aufgaben, vier Phasen</text>
  <text x="76" y="176" class="sub">Eine bedarfsgerechte Checkliste – passend zum Projektumfang.</text>
  <g transform="translate(64 222)">
    <g>
      <rect width="344" height="470" rx="22" fill="#fff"/>
      <rect width="344" height="13" rx="6" fill="#FF9A7E"/>
      <circle cx="36" cy="60" r="19" fill="#FF9A7E"/><text x="36" y="66" text-anchor="middle" class="num">1</text>
      <text x="68" y="68" class="phase">Ziel &amp; Rahmen</text>
      <circle cx="34" cy="137" r="15" fill="#1C1726"/><text x="34" y="142" text-anchor="middle" class="num">01</text><text x="62" y="143" class="item">Ziel und Zielgruppe</text>
      <circle cx="34" cy="218" r="15" fill="#1C1726"/><text x="34" y="223" text-anchor="middle" class="num">02</text><text x="62" y="213" class="item"><tspan x="62">Umfang, Budget und</tspan><tspan x="62" dy="23">Verantwortung</tspan></text>
      <circle cx="34" cy="313" r="15" fill="#1C1726"/><text x="34" y="318" text-anchor="middle" class="num">03</text><text x="62" y="319" class="item">Angebot und Markt</text>
      <path d="M62 390h218" stroke="#EDE8E3" stroke-width="2"/>
      <text x="32" y="430" class="foot">Klarheit über Zweck und</text><text x="32" y="454" class="foot">Rahmen schaffen</text>
    </g>
    <g transform="translate(368)">
      <rect width="344" height="470" rx="22" fill="#fff"/><rect width="344" height="13" rx="6" fill="#8038EE"/>
      <circle cx="36" cy="60" r="19" fill="#8038EE"/><text x="36" y="66" text-anchor="middle" class="num">2</text>
      <text x="68" y="68" class="phase">Recherche &amp; Inhalte</text>
      <circle cx="34" cy="137" r="15" fill="#1C1726"/><text x="34" y="142" text-anchor="middle" class="num">04</text><text x="62" y="143" class="item">Suchintention und Wettbewerb</text>
      <circle cx="34" cy="218" r="15" fill="#1C1726"/><text x="34" y="223" text-anchor="middle" class="num">05</text><text x="62" y="213" class="item"><tspan x="62">Seitenplan und</tspan><tspan x="62" dy="23">Anfrageweg</tspan></text>
      <circle cx="34" cy="313" r="15" fill="#1C1726"/><text x="34" y="318" text-anchor="middle" class="num">06</text><text x="62" y="319" class="item">Wissen und Vertrauensbelege</text>
      <path d="M62 390h218" stroke="#EDE8E3" stroke-width="2"/>
      <text x="32" y="430" class="foot">Relevantes finden und</text><text x="32" y="454" class="foot">inhaltlich ordnen</text>
    </g>
    <g transform="translate(736)">
      <rect width="344" height="470" rx="22" fill="#fff"/><rect width="344" height="13" rx="6" fill="#FF9A7E"/>
      <circle cx="36" cy="60" r="19" fill="#FF9A7E"/><text x="36" y="66" text-anchor="middle" class="num">3</text>
      <text x="68" y="68" class="phase">Texte &amp; Marke</text>
      <circle cx="34" cy="137" r="15" fill="#1C1726"/><text x="34" y="142" text-anchor="middle" class="num">07</text><text x="62" y="143" class="item">Texte</text>
      <circle cx="34" cy="218" r="15" fill="#1C1726"/><text x="34" y="223" text-anchor="middle" class="num">08</text><text x="62" y="213" class="item"><tspan x="62">Bilder, Videos und</tspan><tspan x="62" dy="23">Nutzungsrechte</tspan></text>
      <circle cx="34" cy="313" r="15" fill="#1C1726"/><text x="34" y="318" text-anchor="middle" class="num">09</text><text x="62" y="319" class="item">Brandbook und Gestaltung</text>
      <path d="M62 390h218" stroke="#EDE8E3" stroke-width="2"/>
      <text x="32" y="430" class="foot">Stimme, Bildwelt und</text><text x="32" y="454" class="foot">Gestaltung abstimmen</text>
    </g>
    <g transform="translate(1104)">
      <rect width="344" height="470" rx="22" fill="#fff"/><rect width="344" height="13" rx="6" fill="#8038EE"/>
      <circle cx="36" cy="60" r="19" fill="#8038EE"/><text x="36" y="66" text-anchor="middle" class="num">4</text>
      <text x="68" y="68" class="phase">Start vorbereiten</text>
      <circle cx="34" cy="137" r="15" fill="#1C1726"/><text x="34" y="142" text-anchor="middle" class="num">10</text><text x="62" y="133" class="item"><tspan x="62">Technik, Zugänge</tspan><tspan x="62" dy="23">und Daten</tspan></text>
      <circle cx="34" cy="230" r="15" fill="#1C1726"/><text x="34" y="235" text-anchor="middle" class="num">11</text><text x="62" y="221" class="item"><tspan x="62">Bestehende Inhalte</tspan><tspan x="62" dy="23">und URLs*</tspan></text>
      <circle cx="34" cy="323" r="15" fill="#1C1726"/><text x="34" y="328" text-anchor="middle" class="num">12</text><text x="62" y="318" class="item"><tspan x="62">Messung, Freigabe</tspan><tspan x="62" dy="23">und Betreuung</tspan></text>
      <path d="M62 390h218" stroke="#EDE8E3" stroke-width="2"/>
      <text x="32" y="430" class="foot">Betrieb und Übergang</text><text x="32" y="454" class="foot">mitdenken</text>
    </g>
  </g>
  <text x="78" y="744" class="foot">* Nur beim Relaunch: Inhalte sichern, URL-Änderungen zuordnen, Weiterleitungen planen.</text>
  <text x="78" y="768" class="foot">Die Aufgaben lassen sich je nach Aufwand zusammenfassen.</text>
  <path d="M78 800h1028" stroke="#CFC7C0" stroke-width="2"/>
  <circle cx="1160" cy="800" r="27" fill="#8038EE"/><path d="M1148 800h24m-8-8 8 8-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1204" y="766" width="320" height="68" rx="18" fill="#1C1726"/><text x="1364" y="809" text-anchor="middle" class="build">Website bauen</text>
  <text x="78" y="872" class="foot">VibePerform · Vorbereitung einer Firmenwebseite</text>
</svg>
